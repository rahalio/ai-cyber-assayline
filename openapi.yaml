openapi: 3.0.3
info:
  title: Assayline
  version: 0.1.0
  description: >-
    Validation factory operating system for bank model risk functions. Assayline
    determines whether an artefact is a model, refuses a validation slot to an
    incomplete submission, sizes validation depth to the model's tier, enforces
    independence, and turns conservatism inside approved models into an explicit,
    priced register that senior management can reduce deliberately.
  x-product-slug: ai-cyber-assayline
  x-source: ai-in-cyber/The-evolution-of-model-risk-management/
servers:
  - url: https://api.example.com
tags:
  - name: Inventory
    description: Artefact determinations and the model estate boundary
  - name: Tiering
    description: Materiality-based tier assessments and criteria
  - name: Submissions
    description: Completeness gate, returns, and slot eligibility
  - name: Validation
    description: Calendar, engagements, tasks, and work placement
  - name: Findings
    description: Severity-graded findings and automatic use constraints
  - name: Conservatism
    description: Explicit conservatism overlays and estate aggregation
  - name: Use
    description: Permitted-use records and committee exceptions
  - name: Monitoring
    description: Owner obligations, breaches, and revalidation triggers
  - name: Quantification
    description: Model risk quantification against appetite and buffers
  - name: Supervisory
    description: Capital add-ons, remediation, and examination packs
paths:
  /v1/artefacts:
    get:
      operationId: listArtefacts
      tags: [Inventory]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: determination
          in: query
          schema:
            type: string
            enum: [model, not_model, pending]
      responses:
        "200":
          description: Candidate artefacts page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeArtefact"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: registerArtefact
      tags: [Inventory]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtefactCreate"
      responses:
        "201":
          description: Artefact registered pending determination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeArtefact"
  /v1/artefacts/{artefactId}/determination:
    parameters:
      - $ref: "#/components/parameters/ArtefactId"
    post:
      operationId: determineArtefact
      tags: [Inventory]
      description: >-
        Record a dated model-or-not determination against published criteria.
        An inventory whose boundary is undocumented cannot support capital
        quantification or supervisory challenge.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelDeterminationCreate"
      responses:
        "201":
          description: Determination recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeModelDetermination"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/models:
    get:
      operationId: listModels
      tags: [Inventory]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: tier
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 3
        - name: status
          in: query
          schema:
            type: string
            enum: [inventory, queued, in_validation, approved, constrained, retired]
      responses:
        "200":
          description: Model inventory page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeModel"
  /v1/models/{modelId}:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    get:
      operationId: getModel
      tags: [Inventory]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Model with current tier and permitted use summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeModel"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/models/{modelId}/tier-assessments:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    get:
      operationId: listTierAssessments
      tags: [Tiering]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Tier history for the model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeTierAssessment"
    post:
      operationId: assessModelTier
      tags: [Tiering]
      description: >-
        Set tier from materiality, potential financial loss, parameter
        uncertainty, regulatory impact, and intended use. Tier selects the
        validation playbook.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TierAssessmentCreate"
      responses:
        "201":
          description: Tier assessment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTierAssessment"
  /v1/tier-criteria:
    get:
      operationId: getTierCriteria
      tags: [Tiering]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Published tiering criteria owned by the control unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTierCriteria"
    put:
      operationId: updateTierCriteria
      tags: [Tiering]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TierCriteria"
      responses:
        "200":
          description: Criteria updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTierCriteria"
  /v1/submissions:
    get:
      operationId: listSubmissions
      tags: [Submissions]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [received, gapped, returned, accepted]
        - name: submittingFunction
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Submissions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeSubmission"
    post:
      operationId: createSubmission
      tags: [Submissions]
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionCreate"
      responses:
        "201":
          description: Submission received and completeness-checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSubmission"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/submissions/{submissionId}/completeness-check:
    parameters:
      - $ref: "#/components/parameters/SubmissionId"
    post:
      operationId: checkSubmissionCompleteness
      tags: [Submissions]
      description: >-
        Re-run the published completeness standard. Incomplete submissions
        do not receive a validation slot; returns are attributed to the
        submitting function with missing components named.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Completeness result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSubmission"
  /v1/submissions/{submissionId}/return:
    parameters:
      - $ref: "#/components/parameters/SubmissionId"
    post:
      operationId: returnSubmission
      tags: [Submissions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionReturnCreate"
      responses:
        "200":
          description: Submission returned with attribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSubmission"
  /v1/validation/slots:
    get:
      operationId: listValidationSlots
      tags: [Validation]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [open, allocated, deferred, released]
      responses:
        "200":
          description: Validation calendar slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeValidationSlot"
    post:
      operationId: allocateValidationSlot
      tags: [Validation]
      description: >-
        Allocate a slot only when the submission is accepted. Refuses allocation
        for gapped or returned submissions.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationSlotAllocate"
      responses:
        "201":
          description: Slot allocated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeValidationSlot"
        "409":
          description: Submission not accepted or capacity unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/validation/engagements:
    get:
      operationId: listValidationEngagements
      tags: [Validation]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: modelId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [planned, in_progress, completed, aborted]
      responses:
        "200":
          description: Validation engagements page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeValidationEngagement"
    post:
      operationId: createValidationEngagement
      tags: [Validation]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationEngagementCreate"
      responses:
        "201":
          description: Engagement created with tiered playbook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeValidationEngagement"
        "403":
          description: Independence separation would be violated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/validation/engagements/{engagementId}/tasks:
    parameters:
      - $ref: "#/components/parameters/EngagementId"
    get:
      operationId: listValidationTasks
      tags: [Validation]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Tasks for the engagement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeValidationTask"
    post:
      operationId: placeValidationTask
      tags: [Validation]
      description: >-
        Route a decomposable task onshore, offshore, or externally with a
        recorded data-sensitivity basis and unit cost.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationTaskCreate"
      responses:
        "201":
          description: Task placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeValidationTask"
  /v1/validation/capacity-forecast:
    get:
      operationId: getCapacityForecast
      tags: [Validation]
      security:
        - BearerAuth: []
      parameters:
        - name: horizonQuarters
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 8
            default: 4
      responses:
        "200":
          description: Estate growth set against validator capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCapacityForecast"
  /v1/findings:
    get:
      operationId: listFindings
      tags: [Findings]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: modelId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [open, constrained, closed]
        - name: minSeverity
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
      responses:
        "200":
          description: Findings page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeFinding"
    post:
      operationId: raiseFinding
      tags: [Findings]
      description: >-
        Raise a severity-graded finding. Above the configured severity for the
        model's tier, permitted use is automatically restricted until closure.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingCreate"
      responses:
        "201":
          description: Finding raised; use constraint may be applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeFinding"
  /v1/findings/{findingId}/close:
    parameters:
      - $ref: "#/components/parameters/FindingId"
    post:
      operationId: closeFinding
      tags: [Findings]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [closureRationale]
              properties:
                closureRationale:
                  type: string
                releaseConstraint:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Finding closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeFinding"
  /v1/conservatism-overlays:
    get:
      operationId: listConservatismOverlays
      tags: [Conservatism]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: modelId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [declared, approved, under_review, removed]
      responses:
        "200":
          description: Conservatism overlays page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeConservatismOverlay"
    post:
      operationId: declareConservatismOverlay
      tags: [Conservatism]
      description: >-
        Record explicit conservatism at a named model location with magnitude,
        rationale, approver, and review date. Models may not be approved with
        material undocumented conservatism.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConservatismOverlayCreate"
      responses:
        "201":
          description: Overlay declared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeConservatismOverlay"
  /v1/conservatism-overlays/aggregate:
    get:
      operationId: getConservatismAggregate
      tags: [Conservatism]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Estate-level explicit conservatism priced for capital decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeConservatismAggregate"
  /v1/models/{modelId}/permitted-use:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    get:
      operationId: getPermittedUse
      tags: [Use]
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: Permitted-use record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePermittedUse"
    put:
      operationId: setPermittedUse
      tags: [Use]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermittedUse"
      responses:
        "200":
          description: Permitted use set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePermittedUse"
  /v1/use-exceptions:
    get:
      operationId: listUseExceptions
      tags: [Use]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [requested, authorised, expired, breached]
      responses:
        "200":
          description: Use exceptions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeUseException"
    post:
      operationId: requestUseException
      tags: [Use]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UseExceptionCreate"
      responses:
        "201":
          description: Exception requested for risk committee decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeUseException"
  /v1/use-exceptions/{exceptionId}/authorise:
    parameters:
      - $ref: "#/components/parameters/ExceptionId"
    post:
      operationId: authoriseUseException
      tags: [Use]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, expiry, compensatingConditions]
              properties:
                decision:
                  type: string
                  enum: [authorised, refused]
                expiry:
                  type: string
                  format: date-time
                compensatingConditions:
                  type: array
                  items:
                    type: string
                committeeReference:
                  type: string
      responses:
        "200":
          description: Exception decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeUseException"
  /v1/monitoring/obligations:
    get:
      operationId: listMonitoringObligations
      tags: [Monitoring]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: modelId
          in: query
          schema:
            type: string
        - name: inBreach
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Monitoring obligations page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeMonitoringObligation"
    post:
      operationId: assignMonitoringObligation
      tags: [Monitoring]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitoringObligationCreate"
      responses:
        "201":
          description: Obligation assigned at approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeMonitoringObligation"
  /v1/monitoring/breaches:
    post:
      operationId: recordMonitoringBreach
      tags: [Monitoring]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitoringBreachCreate"
      responses:
        "201":
          description: Breach recorded; revalidation may be triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeMonitoringBreach"
  /v1/revalidation-triggers:
    get:
      operationId: listRevalidationTriggers
      tags: [Monitoring]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Revalidation triggers page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeRevalidationTrigger"
  /v1/quantifications:
    get:
      operationId: listQuantifications
      tags: [Quantification]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: modelId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Model risk quantifications page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeModelRiskQuantification"
    post:
      operationId: recordQuantification
      tags: [Quantification]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelRiskQuantificationCreate"
      responses:
        "201":
          description: Quantification recorded against appetite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeModelRiskQuantification"
  /v1/risk-appetite:
    get:
      operationId: getRiskAppetiteStatement
      tags: [Quantification]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Stated model risk appetite and KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRiskAppetiteStatement"
    put:
      operationId: updateRiskAppetiteStatement
      tags: [Quantification]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskAppetiteStatement"
      responses:
        "200":
          description: Appetite updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRiskAppetiteStatement"
  /v1/lump-sum-buffers:
    get:
      operationId: listLumpSumBuffers
      tags: [Quantification]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Documented buffers where quantification is impossible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeLumpSumBuffer"
    post:
      operationId: fixLumpSumBuffer
      tags: [Quantification]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LumpSumBufferCreate"
      responses:
        "201":
          description: Buffer fixed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeLumpSumBuffer"
  /v1/supervisory-add-ons:
    get:
      operationId: listSupervisoryAddOns
      tags: [Supervisory]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [open, remediating, reduced, closed]
      responses:
        "200":
          description: Supervisory capital add-ons page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeSupervisoryAddOn"
    post:
      operationId: recordSupervisoryAddOn
      tags: [Supervisory]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupervisoryAddOnCreate"
      responses:
        "201":
          description: Add-on recorded as managed liability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSupervisoryAddOn"
  /v1/supervisory-add-ons/{addOnId}/remediation:
    parameters:
      - $ref: "#/components/parameters/AddOnId"
    put:
      operationId: updateRemediationPlan
      tags: [Supervisory]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemediationPlan"
      responses:
        "200":
          description: Remediation plan updated with measured reduction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSupervisoryAddOn"
  /v1/supervisory-packs:
    post:
      operationId: assembleSupervisoryPack
      tags: [Supervisory]
      description: >-
        Assemble an examination pack from the live record — inventory boundary
        decisions, tiering rationale, validation evidence, open findings, and
        quantified model risk against appetite.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope:
                  type: string
                  enum: [full_estate, regulatory_models, material_models]
