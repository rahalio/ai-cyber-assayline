openapi: 3.1.0
info:
  title: Assayline — Submissions API
  version: 0.1.0
  description: Completeness gate, returns, and slot eligibility
  license:
    name: Proprietary
    url: https://assayline.local/license
  x-domain: sub
  x-product-slug: assayline
  x-maturity: draft
servers:
- url: https://api.assayline.local
  description: Local / starter API
security:
- apiKey: []
- bearerAuth: []
tags:
- name: Submissions
  description: Completeness gate, returns, and slot eligibility
paths:
  /v1/submissions:
    get:
      operationId: listSubmissions
      tags:
      - Submissions
      security:
      - bearerAuth: []
      parameters:
      - $ref: ./common/parameters.yaml#/components/parameters/Cursor
      - $ref: ./common/parameters.yaml#/components/parameters/Limit
      - name: status
        in: query
        schema:
          type: string
          enum:
          - received
          - gapped
          - returned
          - accepted
      - name: submittingFunction
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Submissions page
          content:
            application/json:
              schema:
                $ref: ./submissions.schemas.yaml#/components/schemas/SubmissionListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
      summary: List Submissions
    post:
      operationId: createSubmission
      tags:
      - Submissions
      security:
      - bearerAuth: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./submissions.schemas.yaml#/components/schemas/SubmissionCreate
      responses:
        '201':
          description: Submission received and completeness-checked
          content:
            application/json:
              schema:
                $ref: ./submissions.schemas.yaml#/components/schemas/SubmissionResponse
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
      x-dynamodb:
        entityType: SUBMISSION
        pkPatternTemplate: SUBMISSION#${submissionId}
        skPatternTemplate: METADATA
      summary: Create Submission
  /v1/submissions/{submissionId}/completeness-check:
    parameters:
    - $ref: ./submissions.schemas.yaml#/components/parameters/SubmissionId
    post:
      operationId: checkSubmissionCompleteness
      tags:
      - Submissions
      description: Re-run the published completeness standard. Incomplete submissions do not receive a
        validation slot; returns are attributed to the submitting function with missing components named.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Completeness result
          content:
            application/json:
              schema:
                $ref: ./submissions.schemas.yaml#/components/schemas/SubmissionResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
      summary: Check Submission Completeness
  /v1/submissions/{submissionId}/return:
    parameters:
    - $ref: ./submissions.schemas.yaml#/components/parameters/SubmissionId
    post:
      operationId: returnSubmission
      tags:
      - Submissions
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./submissions.schemas.yaml#/components/schemas/SubmissionReturnCreate
      responses:
        '200':
          description: Submission returned with attribution
          content:
            application/json:
              schema:
                $ref: ./submissions.schemas.yaml#/components/schemas/SubmissionResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
      summary: Return Submission
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
