openapi: 3.1.0
info:
  title: Assayline — Supervisory API
  version: 0.1.0
  description: Capital add-ons, remediation, and examination packs
  license:
    name: Proprietary
    url: https://assayline.local/license
  x-domain: spv
  x-product-slug: assayline
  x-maturity: draft
servers:
- url: https://api.assayline.local
  description: Local / starter API
security:
- apiKey: []
- bearerAuth: []
tags:
- name: Supervisory
  description: Capital add-ons, remediation, and examination packs
paths:
  /v1/supervisory-add-ons:
    get:
      operationId: listSupervisoryAddOns
      tags:
      - Supervisory
      security:
      - bearerAuth: []
      parameters:
      - $ref: ./common/parameters.yaml#/components/parameters/Cursor
      - $ref: ./common/parameters.yaml#/components/parameters/Limit
      - name: status
        in: query
        schema:
          type: string
          enum:
          - open
          - remediating
          - reduced
          - closed
      responses:
        '200':
          description: Supervisory capital add-ons page
          content:
            application/json:
              schema:
                $ref: ./supervisory.schemas.yaml#/components/schemas/SupervisoryAddOnListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
      summary: List Supervisory Add Ons
    post:
      operationId: recordSupervisoryAddOn
      tags:
      - Supervisory
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./supervisory.schemas.yaml#/components/schemas/SupervisoryAddOnCreate
      responses:
        '201':
          description: Add-on recorded as managed liability
          content:
            application/json:
              schema:
                $ref: ./supervisory.schemas.yaml#/components/schemas/SupervisoryAddOnResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
      x-dynamodb:
        entityType: SUPERVISORY_ADD_ON
        pkPatternTemplate: SUPERVISORY_ADD_ON#${addOnId}
        skPatternTemplate: METADATA
      summary: Record Supervisory Add On
  /v1/supervisory-add-ons/{addOnId}/remediation:
    parameters:
    - $ref: ./supervisory.schemas.yaml#/components/parameters/AddOnId
    put:
      operationId: updateRemediationPlan
      tags:
      - Supervisory
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./supervisory.schemas.yaml#/components/schemas/RemediationPlan
      responses:
        '200':
          description: Remediation plan updated with measured reduction
          content:
            application/json:
              schema:
                $ref: ./supervisory.schemas.yaml#/components/schemas/SupervisoryAddOnResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
      summary: Update Remediation Plan
  /v1/supervisory-packs:
    post:
      operationId: assembleSupervisoryPack
      tags:
      - Supervisory
      description: Assemble an examination pack from the live record — inventory boundary decisions, tiering
        rationale, validation evidence, open findings, and quantified model risk against appetite.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - scope
              properties:
                scope:
                  type: string
                  enum:
                  - full_estate
                  - regulatory_models
                  - material_models
                asOf:
                  type: string
                  format: date-time
                examinationReference:
                  type: string
      responses:
        '201':
          description: Pack assembled
          content:
            application/json:
              schema:
                $ref: ./supervisory.schemas.yaml#/components/schemas/SupervisoryPackResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
      summary: Assemble Supervisory Pack
  /v1/supervisory-packs/{packId}:
    parameters:
    - $ref: ./supervisory.schemas.yaml#/components/parameters/PackId
    get:
      operationId: getSupervisoryPack
      tags:
      - Supervisory
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Supervisory pack
          content:
            application/json:
              schema:
                $ref: ./supervisory.schemas.yaml#/components/schemas/SupervisoryPackResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
      x-dynamodb:
        entityType: SUPERVISORY_PACK
        pkPatternTemplate: SUPERVISORY_PACK#${packId}
        skPatternTemplate: METADATA
      summary: Get Supervisory Pack
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
