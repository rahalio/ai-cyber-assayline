openapi: 3.1.0
info:
  title: Assayline — Inventory API
  version: 0.1.0
  description: Artefact determinations and the model estate boundary
  license:
    name: Proprietary
    url: https://assayline.local/license
  x-domain: inv
  x-product-slug: assayline
  x-maturity: draft
servers:
- url: https://api.assayline.local
  description: Local / starter API
security:
- apiKey: []
- bearerAuth: []
tags:
- name: Inventory
  description: Artefact determinations and the model estate boundary
paths:
  /v1/artefacts:
    get:
      operationId: listArtefacts
      tags:
      - Inventory
      security:
      - bearerAuth: []
      parameters:
      - $ref: ./common/parameters.yaml#/components/parameters/Cursor
      - $ref: ./common/parameters.yaml#/components/parameters/Limit
      - name: determination
        in: query
        schema:
          type: string
          enum:
          - model
          - not_model
          - pending
      responses:
        '200':
          description: Candidate artefacts page
          content:
            application/json:
              schema:
                $ref: ./inventory.schemas.yaml#/components/schemas/ArtefactListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
      summary: List Artefacts
    post:
      operationId: registerArtefact
      tags:
      - Inventory
      security:
      - apiKey: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./inventory.schemas.yaml#/components/schemas/ArtefactCreate
      responses:
        '201':
          description: Artefact registered pending determination
          content:
            application/json:
              schema:
                $ref: ./inventory.schemas.yaml#/components/schemas/ArtefactResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
      x-dynamodb:
        entityType: ARTEFACT
        pkPatternTemplate: ARTEFACT#${artefactId}
        skPatternTemplate: METADATA
      summary: Register Artefact
  /v1/artefacts/{artefactId}/determination:
    parameters:
    - $ref: ./inventory.schemas.yaml#/components/parameters/ArtefactId
    post:
      operationId: determineArtefact
      tags:
      - Inventory
      description: Record a dated model-or-not determination against published criteria. An inventory
        whose boundary is undocumented cannot support capital quantification or supervisory challenge.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./inventory.schemas.yaml#/components/schemas/ModelDeterminationCreate
      responses:
        '201':
          description: Determination recorded
          content:
            application/json:
              schema:
                $ref: ./inventory.schemas.yaml#/components/schemas/ModelDeterminationResponse
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
      summary: Determine Artefact
  /v1/models:
    get:
      operationId: listModels
      tags:
      - Inventory
      security:
      - bearerAuth: []
      parameters:
      - $ref: ./common/parameters.yaml#/components/parameters/Cursor
      - $ref: ./common/parameters.yaml#/components/parameters/Limit
      - name: tier
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 3
      - name: status
        in: query
        schema:
          type: string
          enum:
          - inventory
          - queued
          - in_validation
          - approved
          - constrained
          - retired
      responses:
        '200':
          description: Model inventory page
          content:
            application/json:
              schema:
                $ref: ./inventory.schemas.yaml#/components/schemas/ModelListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
      summary: List Models
  /v1/models/{modelId}:
    parameters:
    - $ref: ./inventory.schemas.yaml#/components/parameters/ModelId
    get:
      operationId: getModel
      tags:
      - Inventory
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Model with current tier and permitted use summary
          content:
            application/json:
              schema:
                $ref: ./inventory.schemas.yaml#/components/schemas/ModelResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
      x-dynamodb:
        entityType: MODEL
        pkPatternTemplate: MODEL#${modelId}
        skPatternTemplate: METADATA
      summary: Get Model
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
