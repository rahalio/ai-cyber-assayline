openapi: 3.1.0
info:
  title: Submissions API schemas
  version: 0.1.0
  description: Schemas for Assayline submissions domain.
paths: {}
components:
  parameters:
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
  schemas:
    SubmissionListData:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Submission'
    SubmissionListResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/SubmissionListData'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
    SubmissionReturnCreate:
      type: object
      required:
      - missingComponents
      - attributedTo
      properties:
        missingComponents:
          type: array
          items:
            type: string
        attributedTo:
          type: string
        notes:
          type: string
    SubmissionCreate:
      type: object
      required:
      - modelId
      - submittingFunction
      properties:
        modelId:
          type: string
        submittingFunction:
          type: string
        componentsPresent:
          type: array
          items:
            type: string
        feederModelIds:
          type: array
          items:
            type: string
    Submission:
      type: object
      required:
      - id
      - modelId
      - status
      - submittingFunction
      properties:
        id:
          type: string
        modelId:
          type: string
        status:
          type: string
          enum:
          - received
          - gapped
          - returned
          - accepted
        submittingFunction:
          type: string
        missingComponents:
          type: array
          items:
            type: string
            enum:
            - data
            - feeder_models
            - monitoring_plan
            - documentation
            - prior_findings
        returnCount:
          type: integer
        acceptedAt:
          type: string
          format: date-time
    SubmissionResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Submission'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
